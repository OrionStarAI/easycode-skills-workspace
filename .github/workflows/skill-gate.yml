name: Skill Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test marketplace automation client
        run: node --test skills/marketplace-curator/scripts/marketplace-api.test.mjs

      - name: Run parser regression test
        run: ruby scripts/validate_skills.rb --self-test

      - name: Run upstream sync regression test
        run: ruby scripts/sync_upstreams.rb --self-test

      - name: Validate skill tree
        run: ruby scripts/validate_skills.rb

      - name: Run catalog regression test
        run: ruby scripts/validate_catalog.rb --self-test

      - name: Validate expert and MCP catalogs
        run: ruby scripts/validate_catalog.rb
